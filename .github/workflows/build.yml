name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version:
          - 17
          - 21
          - 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Verify java.base-only dependencies
        run: |
          JAR=$(ls build/libs/aircompressor-*.jar | grep -v -- '-sources\.jar$')
          jdeps -s "$JAR" | tee build/jdeps.txt
          grep -Eq ' -> java\.base$' build/jdeps.txt
          [ "$(wc -l < build/jdeps.txt)" -eq 1 ]
